# Deploys Cloud Functions to mombongo-dev on every push to trunk
# (feature/s2-00-data-foundation — this repo has no main/dev branch;
# GitHub's own default-branch setting confirms this is genuinely trunk).
# Named "Production" to match the sibling mombongo-web/mombongo-admin
# workflows' vocabulary, but note there is no separate staging project —
# mombongo-dev serves both real users and partner-integration test
# traffic (distinguished by a testMode flag on data, not by environment).
#
# Requires a FIREBASE_TOKEN repo secret (generate with `firebase login:ci`)
# — this repo doesn't have one yet as of 2026-08-31.
#
# The "production" GitHub Environment gates this behind a required
# reviewer — configure at Settings → Environments → production →
# Required reviewers (the environment itself already exists, but has no
# reviewers assigned yet).

name: Deploy — Production

on:
  push:
    branches: [feature/s2-00-data-foundation]

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel a deploy mid-flight

env:
  NODE_VERSION: "20"
  FIREBASE_PROJECT: mombongo-dev

jobs:
  approval-gate:
    name: Manual Approval
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Production deploy approved by required reviewers."

  ci:
    name: Full CI
    runs-on: ubuntu-latest
    needs: approval-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Scoped to --only functions deliberately — this repo's
      # firestore.rules is not deployed by this workflow. Two other repos
      # (mombongo-web, mombongo-admin) already auto-deploy their own,
      # different firestore.rules to this same project on every merge;
      # adding a third auto-deploying source here would make that
      # unresolved conflict worse, not better. See SAI-00's audit notes
      # (sprints/sprint-arom-invoice-integration/SAI-00-overview.md,
      # decision 6) before changing this.
      - name: Deploy functions
        run: |
          npx firebase-tools deploy \
            --only functions \
            --project ${{ env.FIREBASE_PROJECT }} \
            --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
